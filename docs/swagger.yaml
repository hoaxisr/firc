    get:
      description: 'Returns the requested rule'
      parameters:
      - description: 'Group ID'
        in: path
        name: groupID
        required: true
        type: string
      - description: 'Rule ID'
        in: path
        name: ruleID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
