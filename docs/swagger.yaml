          description: OK
          schema:
            $ref: '#/definitions/types.GroupRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.GroupErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: 'Create a group'
      tags:
