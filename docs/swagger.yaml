        required: true
        schema:
          $ref: '#/definitions/types.GroupReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GroupRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.GroupErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: 'Update a group'
      tags:
      - groups
  /api/v1/groups/{groupID}/move-up:
    post:
      description: >-
        Moves a group with an interface list back to its first entry at once,
        without waiting for the hold, and answers the group record. A group
        already on its first entry answers 200 unchanged.
      parameters:
      - description: 'Group ID'
        in: path
        name: groupID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GroupRes'
        "400":
          description: 'Bad Request -- "the group names one interface", or an invalid id'
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "404":
          description: 'Not Found -- "group not exist"'
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "409":
          description: 'Conflict -- "<first entry> is not alive": the first entry cannot take the group now; "the group is not routed": the group is off or not up; "no check runs for the group": nothing checks its interfaces'
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: 'Move the group back to its first interface'
      tags:
      - groups
  /api/v1/groups/{groupID}/rules:
    get:
      description: 'Returns the list of rules'
      parameters:
      - description: 'Group ID'
        in: path
        name: groupID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.RulesRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: 'Get the list of rules'
