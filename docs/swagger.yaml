definitions:
  types.AuthRes:
    properties:
      enabled:
        example: true
        type: boolean
    type: object
  types.Host:
    properties:
      active:
        description: 'The firmware sees the device now'
        example: true
        type: boolean
      ip:
        description: 'The device''s IPv4 address; an empty string if it has none'
        example: 192.168.1.5
        type: string
      ip6:
        items:
          example: fd00::5
          type: string
        type: array
      mac:
        description: 'MAC in lower case with colons -- exactly what goes into mac:<MAC>'
        example: aa:bb:cc:dd:ee:ff
        type: string
      name:
        description: 'The firmware''s name, else the hostname, else an empty string'
        example: TV
        type: string
      policy:
        description: >-
          The internal name of the device's policy: its own, else the policy
          of the segment its address falls in; empty if neither
        example: Policy0
        type: string
      registered:
        description: 'The device is registered in the firmware'
        example: true
        type: boolean
    type: object
  types.HostsRes:
    properties:
      hosts:
        items:
          $ref: '#/definitions/types.Host'
        type: array
    type: object
  types.Policy:
    properties:
      description:
        description: 'The policy''s human name from the router''s interface; absent if the firmware does not give one'
        example: Kids
        type: string
      devices:
        description: 'How many devices (hotspot table hosts) are in this policy; a device may have several addresses and is counted once'
        example: 2
        type: integer
      name:
        description: 'The internal name -- the one the device selector understands'
        example: Policy0
        type: string
    type: object
  types.PoliciesRes:
    properties:
      policies:
        items:
          $ref: '#/definitions/types.Policy'
        type: array
    type: object
  types.SettingsRes:
    properties:
      settings:
        additionalProperties: {}
        description: >-
          YAML path -> saved value. Numbers as numbers; timeout in
          milliseconds, ttlClamp in seconds; link is an
          array of strings; startMarkTableIndex is a string like 0x66697263
        example:
          app.dnsProxy.upstream.address: 127.0.0.1
          app.dnsProxy.upstream.port: 53
          app.dnsProxy.timeout: 5000
          app.check.url: http://cp.cloudflare.com/generate_204
          app.check.wanUrl: ""
          app.check.interval: 30
          app.check.timeout: 5
        type: object
      classes:
        additionalProperties:
          enum:
          - live
          - restart
          type: string
        type: object
      pendingRestart:
        description: 'Restart settings whose saved value is not in effect yet'
        items:
          type: string
        type: array
      boot:
        description: >-
          Identity of this daemon run, the journal's boot id. It changes with
          every start, so a client that saw it before a restart knows the
          daemon that answers now is a new one.
        type: string
      restarting:
        description: >-
          True while a restart asked for through POST /system/restart is under
          way. It drops to false when the restart script could not start or
          the daemon was not stopped within the restart timeout.
        type: boolean
      webUi:
        description: >-
          The WebUI as this run listens. When the configured port was in use
          at start, the next free of 666, 999, 1666, 2666, 9999 was taken and
          saved to firc.conf.
        properties:
          port:
            description: 'The port listened on; 0 when the WebUI is not listening'
            example: 666
            type: integer
          movedFrom:
            description: 'The configured port that was in use at start; 0 when none was'
            example: 8080
            type: integer
          lanAddress:
            description: >-
              The address to open it on: the configured one, or for an
              any-address the first IPv4 of the first link interface; empty
              when there is none
            example: 192.168.1.1
            type: string
        type: object
    type: object
  types.SettingsPutReq:
    properties:
      settings:
        additionalProperties: {}
        description: 'Only the changed settings, YAML path -> value'
        type: object
    type: object
  types.SettingsPutRes:
    properties:
      applied:
        description: 'Live settings applied by this save'
        items:
          type: string
        type: array
      pendingRestart:
        description: 'The full list of settings waiting for a restart after this save'
        items:
          type: string
        type: array
    type: object
  types.SettingsErrorRes:
    properties:
      error:
        example: not an IPv4 or IPv6 address
        type: string
      field:
        description: 'YAML path of the rejected setting'
        example: app.dnsProxy.upstream.address
        type: string
    type: object
  types.RestartRes:
    properties:
      restarting:
        example: true
        type: boolean
    type: object
  types.UpdateRelease:
    properties:
      version:
        description: 'X.Y.Z from the tag; the tag itself when it is not a version'
        example: 0.2.0
        type: string
      revision:
        description: 'The package revision from a -revN tag, 1 when absent; 0 when the tag is not a version'
        example: 1
        type: integer
      tag:
        example: 0.2.0
        type: string
      publishedAt:
        example: '2026-10-07T20:27:40Z'
        type: string
      notes:
        description: 'The release notes, at most 16 KiB, cut on a character boundary'
        type: string
      asset:
        description: >-
          The package for this router's target; null when the tag is not a
          version, the release is a prerelease or draft, the build has no
          target, or the release has no such package or more than one
        properties:
          name:
            example: firc_0.2.0-1_entware_mipsel-3.4_kn.ipk
            type: string
          size:
            example: 829104
            type: integer
        type: object
        x-nullable: true
    type: object
  types.UpdateCheck:
    properties:
      checkedAt:
        description: 'Unix time of the last attempt, seconds'
        example: 1791831000
        type: integer
      ageS:
        description: >-
          Seconds since the last attempt, on the router's monotonic clock;
          judge staleness by this, not by checkedAt against another clock
        example: 12
        type: integer
      latest:
        allOf:
        - $ref: '#/definitions/types.UpdateRelease'
        description: >-
          The latest release from the last successful check; null when no
          check has succeeded since start or the repository has no release.
          A failed check keeps it.
        x-nullable: true
      newer:
        description: 'latest is newer than the installed build'
        type: boolean
      installable:
        description: 'latest has exactly one usable package for this target'
        type: boolean
      reason:
        description: 'Why latest is not installable; null when it is'
        enum:
        - unknown-version
        - prerelease
        - no-target
        - no-asset
        - many-assets
        - not-uploaded
        - no-digest
        - bad-size
        - bad-url
        type: string
        x-nullable: true
      error:
        description: 'Why the last attempt failed; null when it succeeded'
        type: string
        x-nullable: true
    type: object
  types.UpdateStatus:
    properties:
      installed:
        properties:
          version:
            example: 0.2.0
            type: string
          revision:
            example: 1
            type: integer
          target:
            description: 'The Entware target this build is for; empty for a build with none'
            example: mipsel-3.4_kn
            type: string
        type: object
      canInstall:
        description: 'This build could install a release'
        type: boolean
      reason:
        description: >-
          Why it cannot: no-target (built without one), unknown-version (a
          version that is not X.Y.Z), dev-build (a ~git build); null when it
          can
        enum:
        - no-target
        - unknown-version
        - dev-build
        type: string
        x-nullable: true
      check:
        allOf:
        - $ref: '#/definitions/types.UpdateCheck'
        description: 'The last check; null before the first attempt since start'
        x-nullable: true
      state:
        description: >-
          installing while an installer is alive, also one this daemon did not
          start (the daemon that comes up during opkg's upgrade reports it);
          failed when the last install's installer is gone and left no result;
          idle once opkg has finished, whatever its exit -- then result says
          how it ended
        enum:
        - idle
        - checking
        - downloading
        - verifying
        - installing
        - failed
        type: string
      progress:
        description: 'Bytes downloaded so far; null unless state is downloading'
        properties:
          bytes:
            type: integer
          total:
            type: integer
        type: object
        x-nullable: true
      error:
        description: 'Why the last install failed; null when none did'
        type: string
        x-nullable: true
      result:
        description: >-
          How opkg ended the last install, kept until the next install starts;
          null when no install has finished
        properties:
          version:
            description: 'The tag that was installed'
            example: 0.3.0
            type: string
          opkgExit:
            description: 'opkg install exit status; 0 is installed'
            example: 0
            type: integer
          finishedAt:
            description: 'Unix time opkg ended, seconds'
            example: 1791831900
            type: integer
          log:
            description: >-
              The last lines opkg printed during that install, up to 4 KiB,
              starting at a line; empty when it printed nothing
            example: "Installing firc (0.3.0-1) to root...\n"
            type: string
        type: object
        x-nullable: true
    type: object
  types.UpdateInstallReq:
    properties:
      version:
        description: 'The tag of the release the last check offered'
        example: 0.3.0
        type: string
    required:
    - version
    type: object
  types.UpdateInstallRes:
    properties:
      version:
        example: 0.3.0
        type: string
      asset:
        example: firc_0.3.0-1_entware_mipsel-3.4_kn.ipk
        type: string
      size:
        example: 829104
        type: integer
    type: object
  types.UpdateRefusal:
    properties:
      error:
        example: 'this build cannot install updates: no-target'
        type: string
      reason:
        description: >-
          On 403 why this build cannot install (as UpdateStatus.reason); on 400
          why the release is not installable (as UpdateCheck.reason); absent
          otherwise
        example: no-target
        type: string
    type: object
  types.UpdateNoSpace:
    properties:
      error:
        example: "the update directory's filesystem has 1048576 bytes free; the install needs 10875920"
        type: string
      free:
        description: 'Bytes free on the update directory''s filesystem'
        example: 1048576
        type: integer
      need:
        description: 'Three times the package plus 8 MiB'
        example: 10875920
        type: integer
    type: object
  types.UpdateRateLimited:
    properties:
      error:
        example: GitHub refuses more checks from this address until 2026-10-12T19:01:29Z
        type: string
      resetAt:
        description: 'Unix time GitHub accepts checks again; null when GitHub named none'
        example: 1791831689
        type: integer
        x-nullable: true
    type: object
  types.Event:
    properties:
      at:
        description: 'Unix time of the event, seconds'
        example: 1789647292
        type: integer
      kind:
        enum:
        - log
        - dns
        - bypass
        type: string
      level:
        enum:
        - debug
        - info
        - warn
        - error
        example: warn
        type: string
      message:
        example: 'group Example routes nothing: "" is not an interface name'
        type: string
      source:
        description: >-
          Who said the line (present only when kind=log): `fircd` for the
          daemon itself, or a tunnel's device (`tunvless0`) for a line its
          tunvless process wrote and for the tunnel's node events. The
          message does not repeat the device.
        example: fircd
        type: string
      seq:
        description: 'Event number; grows by one and is never reused'
        example: 1041
        type: integer
      client:
        description: 'Client IP address (present only when kind=dns or kind=bypass and the client address is known)'
        example: 192.168.1.42
        type: string
      dst:
        description: 'Destination IP address of the flow (present only when kind=bypass)'
        example: 142.250.1.1
        type: string
      port:
        description: 'Destination TCP/UDP port (present only when kind=bypass and the protocol has ports)'
        example: 443
        type: integer
      proto:
        description: 'IP protocol -- tcp, udp, icmp, icmpv6, else the protocol number (present only when kind=bypass)'
        example: udp
        type: string
      how:
        description: 'How the flow was recognised -- addr (by destination address) or sni (by the SNI from the ClientHello, only when the address was not recognised) (present only when kind=bypass)'
        enum:
        - addr
        - sni
        example: addr
        type: string
      name:
        description: >-
          Host name (present only when kind=dns or kind=bypass). For
          kind=bypass recognised by address (how=addr), it is the last name
          firc recorded behind that address -- not necessarily the one this
          client asked for, if the address is shared (a CDN, for example).
        example: youtube.com
        type: string
      qtype:
        description: 'DNS query type -- A, AAAA, CNAME, MX, TXT, SRV, SVCB, HTTPS, PTR, NS, SOA, else TYPE<n> (present only when kind=dns)'
        example: AAAA
        type: string
      rcode:
        description: 'DNS response code -- NOERROR, FORMERR, SERVFAIL, NXDOMAIN, NOTIMP, REFUSED, else RCODE<n> (present only when kind=dns)'
        example: NOERROR
        type: string
      decision:
        description: 'The daemon''s decision on this query (present only when kind=dns)'
        enum:
        - issued
        - not-covered
        - no-match
        - pool-refused
        - passed
        - blocked
        type: string
      resolver:
        description: >-
          Where the answer came from (present only when kind=dns): upstream --
          the common upstream; group -- the group's DNS through its tunnel;
          fallback_* -- the group's DNS failed and the common upstream
          answered (unreachable -- the tunnel is down, timeout -- no answer in
          time, servfail/refused -- it answered SERVFAIL/REFUSED or garbage,
          sink -- it answered with a sink address or an address from firc's
          pool); health_skip -- the group's DNS is resting after three
          failures in a row and the common upstream was asked; cache -- the
          group's DNS answered this name earlier and that answer was still
          valid; local -- firc answered itself, because the name's owner is a
          block group (decision=blocked).
        enum:
        - upstream
        - group
        - fallback_unreachable
        - fallback_timeout
        - fallback_servfail
        - fallback_refused
        - fallback_sink
        - health_skip
        - cache
        - local
        type: string
      group:
        description: >-
          Routing group. For kind=dns -- the group that was applied, if any
          (present only then). For kind=bypass -- the group that owns the
          name, if one does (present only then). firc did not route the flow:
          the capture rules in the kernel pass only a flow whose original
          (pre-DNAT) destination is outside the pool (`! --ctorigdst`, which
          drops everything sent to an issued address) and whose packet mark
          lacks the firc bit (`-m mark ! --mark 0x40000000/0x40000000`, which
          drops everything a subnet/subnet6 rule routed -- it marks the real
          address, and the first condition cannot see it). Not the group
          field: its bits are taken by the Keenetic connection policy
          (`0x0ffffaaa`) of every device in a policy. The first condition
          rests on the address, not on a mark someone further down the chain
          could rewrite; the second is needed because a subnet route never
          reaches the pool.
        properties:
          id:
            description: 'Group ID'
            example: d663876a
            type: string
          name:
            description: 'Group name'
            example: media
            type: string
        type: object
      fake:
        description: 'Fake address from the pool, if one was issued (present only when kind=dns and an address was issued)'
        example: fd00::1:5
        type: string
      reals:
        description: 'The real addresses the name resolved to -- always present when kind=dns, may be empty'
        items:
          type: string
        type: array
      last:
        description: >-
          The last answer firc gave this client for this name in the
          destination address's family -- the answer to A for an IPv4 flow, to
          AAAA for an IPv6 flow (present only when kind=bypass and firc
          remembers such an answer). It remembers for at most 30 minutes and
          at most 8192 (address, name, family) pairs -- older ones are
          evicted, so sooner on a busy network. A missing `last` means firc
          does not remember a query from this address, not that there was
          none: the device may have asked from another of its addresses.
        properties:
          decision:
            description: 'firc''s decision that time'
            enum:
            - issued
            - not-covered
            - no-match
            - pool-refused
            - passed
            - blocked
            type: string
          at:
            description: 'Unix time of that answer, seconds'
            example: 1789647200
            type: integer
          fake:
            description: >-
              The fake address of this family from that answer (absent if it
              had none -- for example, decision=issued with a NODATA answer to
              AAAA for a name without IPv6)
            example: 198.18.0.5
            type: string
        type: object
      repeats:
        description: >-
          How many more flows for (client, name) were folded into this event
          since the previous one -- a 60-second deduplication window (present
          only when kind=bypass)
        example: 0
        type: integer
    type: object
  types.DnsStatsClient:
    properties:
      address:
        example: 192.168.1.10
        type: string
      queries:
        description: 'Queries of the name from this address in the window'
        example: 12
        type: integer
    type: object
  types.DnsStatsOwner:
    properties:
      id:
        example: 0a1b2c3d
        type: string
      name:
        description: 'The group''s name now, not when it was asked'
        example: Ads
        type: string
      interface:
        description: 'The group''s active interface now; `block` for a block group'
        example: block
        type: string
      blocked:
        description: 'Whether that last answer was a block answer'
        example: true
        type: boolean
    type: object
  types.DnsStatsRow:
    properties:
      name:
        example: ads.example.com
        type: string
      queries:
        example: 42
        type: integer
      blocked:
        description: 'Of those, answered by a block group (never a blackhole one)'
        example: 40
        type: integer
      last:
        description: 'Unix time of the last query among the devices asked for'
        example: 1761240000
        type: integer
      owner:
        description: >-
          The group that owned the last answer to the most recent device among
          those asked for, looked up now: null when no group owned it or the
          group is gone.
        allOf:
        - $ref: '#/definitions/types.DnsStatsOwner'
        x-nullable: true
      clients:
        description: 'At most 16 addresses, the busiest first'
        items:
          $ref: '#/definitions/types.DnsStatsClient'
        type: array
      clientsTotal:
        description: 'Every address that asked the name in the window'
        example: 3
        type: integer
    type: object
  types.DnsStatsRes:
    properties:
      window:
        description: 'Seconds the counts cover'
        example: 86400
        type: integer
      now:
        description: >-
          Unix time of this answer by the daemon's clock, the one `since` and
          `last` are on
        example: 1761240000
        type: integer
      since:
        description: >-
          Unix time the counts started (the daemon's start); a window shorter
          than a day while it is less than a day ago.
        example: 1761200000
        type: integer
      queries:
        description: >-
          Queries in the window: every address, keys the ceiling pushed out
          included; with `device`, those addresses' queries the store still
          holds.
        example: 1500
        type: integer
      blocked:
        example: 120
        type: integer
      domains:
        description: 'Distinct names with a query in the window; `q` does not narrow it'
        example: 300
        type: integer
      rows:
        items:
          $ref: '#/definitions/types.DnsStatsRow'
        type: array
      matched:
        description: 'Names matching `q` (every name without it)'
        example: 300
        type: integer
      offset:
        example: 0
        type: integer
    type: object
  types.EventsRes:
    properties:
      boot:
        description: >-
          The name of this daemon run. After a restart event numbers start
          again at 1 and a cursor from the previous run means nothing: a
          client that sees a different `boot` drops its events and cursor and
          asks from 0.
        example: 68d2a1f0-9c3e51a7
        type: string
      dropped:
        description: >-
          How many events between `since` and the last one returned no ring
          holds any more. Always 0 when `since=0`: the client has asked for
          nothing yet and missed nothing.
        example: 0
        type: integer
      events:
        items:
          $ref: '#/definitions/types.Event'
        type: array
      next:
        description: 'Cursor for the next request'
        example: 1041
        type: integer
    type: object
  types.CaptureRes:
    properties:
      endsAt:
        description: >-
          Unix time the capture ends (wall clock; see secondsLeft). Only while
          a capture runs
        example: 1789591553
        type: integer
      last:
        description: >-
          The capture that finished most recently; absent while one runs and
          before the first finishes since the daemon started
        properties:
          ended:
            description: 'How it ended'
            enum: [reached-end, stopped, failed]
            example: reached-end
            type: string
          endedAt:
            description: 'Unix time it ended'
            example: 1789591853
            type: integer
          leaks:
            description: >-
              Bypass events it reported: the number in the summary's "N
              bypasses reported", re-reports after the dedup window included
            example: 2
            type: integer
          startedAt:
            description: 'Unix time it started'
            example: 1789591553
            type: integer
          summary:
            description: 'The result sentences the journal got'
            items:
              type: string
            type: array
        type: object
      running:
        description: 'Whether a capture is running'
        example: true
        type: boolean
      secondsLeft:
        description: >-
          How many seconds the capture really has left, by the monotonic
          clock; never below 0. Only while a capture runs
        example: 300
        type: integer
      token:
        description: 'Only in the answer to POST -- the same token stops the capture'
        example: 3f2a1c0b5d6e7f80
        type: string
    type: object
  types.ErrorRes:
    properties:
      error:
        example: something went wrong
        type: string
    type: object
  types.GroupErrorRes:
    properties:
      error:
        example: resolve.server "127.0.0.1" is a sink address
        type: string
      field:
        description: 'The group field that was rejected'
        example: resolve.server
        type: string
      group:
        description: 'ID of the group whose field was rejected'
        example: 0a1b2c3d
        type: string
    type: object
  types.GroupInterface:
    properties:
      name:
        example: nwg1
        type: string
      state:
        description: 'alive -- the last check answered 204, or the tunnel is UP; dead -- two checks 3 s apart failed, the link is down or gone, or the tunnel carries no traffic; unknown -- not checked yet.'
        enum: [alive, dead, unknown]
        type: string
      since:
        description: 'Unix seconds when the entry entered its state; for unknown, when watching it started. 0 when nothing watches the entry (no check runs, or the group is off).'
        type: integer
      error:
        description: 'Why the last check failed; empty when it passed.'
        type: string
    type: object
  types.GroupList:
    description: 'The list a group takes rules from in addition to its own. The rules themselves are not here -- they are read a page at a time through GET /api/v1/groups/{groupID}/list/rules.'
    properties:
      interval:
        description: 'How often to check the list, in seconds. 0 -- no timer. A whole number 0..4294967295; anything else is 400.'
        example: 86400
        type: integer
      lastUpdate:
        description: 'When the list last changed (unix time). The daemon sets this itself; it is never read from a request body.'
        example: 1700000000
        type: integer
      rulesTotal:
        description: 'How many rules the list has now. rulesTotal: 0 with sync.state "fetching" means "no rules yet", not "an empty list".'
        example: 313000
        type: integer
      sync:
        description: Where the list is between a request and its arrival.
        properties:
          error:
            description: 'Text of the last failure; empty in every other state.'
            example: ''
            type: string
          lastCheck:
            description: 'When the list was last checked (unix time); 0 -- never since the daemon started.'
            example: 1700000000
            type: integer
          progress:
            description: 'null outside queued/fetching; otherwise one of {"stage":"fetch","bytes":...,"total":...}, {"stage":"parse","lines":...}, {"stage":"apply"}.'
            type: object
          state:
            description: 'idle | queued | fetching | error'
            enum:
            - idle
            - queued
            - fetching
            - error
            example: fetching
            type: string
        type: object
      url:
        example: https://example.com/list.txt
        type: string
    type: object
  types.GroupReq:
    properties:
      block:
        description: 'Only for a group whose interface is block: how its names are answered. Absent on PUT keeps the current answer; null or "null" is the default; anything but null, nxdomain and refused is a 400 with field block. Ignored on any other group.'
        enum:
        - 'null'
        - nxdomain
        - refused
        type: string
      devices:
        $ref: '#/definitions/types.DeviceSelector'
        description: Which client devices the group applies to (decided at the DNS answer). Absent on PUT keeps the current selector; null or {} clears it (every device).
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      interface:
        description: 'The interface the group routes through, or its interface list: 1 to 4 names in order of preference, none twice, blackhole and block only alone. block routes nothing and answers the group''s names locally. A list of one is saved and answered as a string.'
        example: nwg0
      list:
        $ref: '#/definitions/types.GroupList'
        description: 'The group''s list. Absent -- the list stays as it is, like devices and rules; null removes the list and keeps the manual rules; an object sets a new list or updates the current one -- url is required and must be http/https with a host, an absent interval keeps the current list''s (0 for a new one, no timer); lastUpdate and sync are never read from the body.'
      name:
        example: Routing
        type: string
      resolve:
        $ref: '#/definitions/types.GroupResolve'
        description: >-
          Where to resolve the group's names. Absent on PUT -- stays as it
          was; null -- the default; an object replaces it whole, a missing key
          takes the default.
      rules:
        items:
          $ref: '#/definitions/types.RuleReq'
        type: array
    type: object
  types.GroupRes:
    properties:
      block:
        description: 'Present only on a group whose interface is block: how its names are answered.'
        enum:
        - 'null'
        - nxdomain
        - refused
        type: string
      active:
        description: 'The entry of the interface list the group routes through now. With every entry dead it is the last one chosen, and liveReason is no-interface.'
        example: nwg1
        type: string
      devices:
        $ref: '#/definitions/types.DeviceSelector'
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      interface:
        description: 'The interface the group routes through, or its interface list: 1 to 4 names in order of preference, none twice, blackhole and block only alone. block routes nothing and answers the group''s names locally. A list of one is saved and answered as a string.'
        example: nwg0
      interfaces:
        description: 'Only for a list of two or more: each entry and its check state, in list order.'
        items:
          $ref: '#/definitions/types.GroupInterface'
        type: array
      list:
        $ref: '#/definitions/types.GroupList'
        description: 'Present only on a group with a list; the group''s manual rules ("rules") are its own too.'
      live:
        description: 'The group is routed -- it is in the DNS view, its interface''s routes and rules are in the kernel, and its chains are written or awaiting a committer pass while passes succeed.'
        example: true
        type: boolean
      liveReason:
        description: 'Present only when live is false. Checked in this order. disabled -- the group is turned off; not-enabled -- enabling it failed, and the daemon retries by itself (after 1 s, then less often, up to once a minute); no-interface -- it is in the DNS view but its interface does not exist, is down, or its name is invalid; its addresses lead nowhere; tunnel-down -- its interface is a tunvless tunnel''s device and that tunnel carries no traffic (no node answers, it is starting, restarting after an exit, off, refused its configuration, has no nodes or no uplink); the routing stays as it is, and the group is live again by itself once a node carries; not-written -- the committer''s first pass after start has not completed, or its passes have failed for five seconds in a row, and its chains may be missing from the kernel (GET /api/v1/system/netfilter says what exactly and since when).'
        enum:
        - disabled
        - not-enabled
        - no-interface
        - tunnel-down
        - not-written
        type: string
      name:
        example: Routing
        type: string
      resolve:
        $ref: '#/definitions/types.GroupResolve'
      resolver:
        $ref: '#/definitions/types.GroupResolver'
      rules:
        items:
          $ref: '#/definitions/types.RuleRes'
        type: array
    type: object
  types.GroupResolve:
    properties:
      server:
        description: >-
          The group's own DNS -- one to four servers separated by commas,
          each address[:port] (IPv6 with a port in brackets), blanks around
          each ignored, none twice; kept in the written order (preferred
          first), IPv4 first.
          Empty -- the DNS servers the firmware bound to the group's
          interface. Not 0.0.0.0, ::, 127.0.0.0/8, ::1, or an address from
          firc's pool. The query goes through the group's tunnel, so a DNS
          server on the local network will not work this way.
        example: 9.9.9.9
        type: string
      tunnel:
        description: 'Resolve the group''s names through its tunnel; true by default'
        example: true
        type: boolean
    type: object
  types.GroupResolver:
    properties:
      health:
        $ref: '#/definitions/types.GroupResolverHealth'
      servers:
        description: >-
          The group's DNS servers, in query order (IPv4 first). An empty list
          with source "group" or "firmware" does not mean the group has no
          DNS: it means none is usable right now (the group is off or not yet
          in the kernel, or the group has only an IPv6 address and no IPv6
          route), and its names go to the common upstream.
        items:
          type: string
        type: array
      source:
        description: >-
          Where the group's DNS comes from: group -- resolve.server, firmware
          -- those the firmware bound to the interface, none -- there are none
          (or the group is a blackhole) and the common upstream is asked, off
          -- resolve.tunnel is off
        enum:
        - group
        - firmware
        - none
        - off
        type: string
    type: object
  types.GroupResolverHealth:
    description: >-
      The group's DNS over the last ten minutes. All zeros, resting false,
      when source is "off" or servers is empty.
    properties:
      fallbacks:
        description: 'Queries in the window that went to the common upstream instead of the group''s DNS'
        example: 4
        type: integer
      last:
        description: 'Unix seconds of the last fallback in the window, 0 when none'
        example: 1792485000
        type: integer
      reason:
        description: 'Why the last fallback in the window happened, as the journal''s resolver field names it (fallback_timeout, health_skip, ...); empty when none'
        example: fallback_timeout
        type: string
      resting:
        description: 'The group''s DNS has not answered since its last rest began; its names go to the common upstream, one query probes it every 30 s'
        example: false
        type: boolean
      since:
        description: 'Unix seconds the current rest began, 0 when not resting'
        example: 0
        type: integer
      total:
        description: 'Queries in the window answered through the group''s DNS or by a fallback; cached answers are not counted'
        example: 37
        type: integer
      window:
        description: The window in seconds
        example: 600
        type: integer
    type: object
  types.DeviceSelector:
    description: 'Which client devices the group rewrites answers for -- for its manual rules and its list alike. An entry is an address, a CIDR prefix, policy:<Keenetic policy name> or mac:<device MAC> (the hotspot table host with that MAC, any of its addresses; : and - are accepted, any case; stored and returned lower-case with :). An address means the device the router knows behind it (all its addresses, up to 63 others). A MAC not in the table matches nobody -- in deny too. deny is checked before allow; an empty allow means every device. A bad entry is 400 with field devices.allow or devices.deny and group.'
    properties:
      allow:
        items:
          example: 192.168.1.0/24
          type: string
        type: array
      deny:
        items:
          example: 192.168.1.5
          type: string
        type: array
    type: object
  types.GroupsReq:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.GroupReq'
        type: array
    type: object
  types.GroupsRes:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.GroupRes'
        type: array
    type: object
  types.InterfaceRes:
    properties:
      id:
        example: nwg0
        type: string
      name:
        description: 'Description: the tunnel description for a tunvless device, else the Keenetic interface description; absent when none'
        example: PRAW-1
        type: string
      ndmsName:
        description: 'Keenetic interface-name (e.g. Wireguard2); absent when unknown or equal to id'
        example: Wireguard2
        type: string
      role:
        description: 'tunnel (a tunvless device, or point-to-point and not external), wan (external by its Keenetic role), lan (a br<N> segment) or other; absent on blackhole and block'
        enum:
        - tunnel
        - wan
        - lan
        - other
        example: tunnel
        type: string
    type: object
  types.InterfaceResolvers:
    properties:
      interface:
        description: 'Interface name in the kernel'
        example: nwg0
        type: string
      servers:
        items:
          type: string
        type: array
    type: object
  types.InterfacesRes:
    properties:
      interfaces:
        items:
          $ref: '#/definitions/types.InterfaceRes'
        type: array
    type: object
  types.ResolversRes:
    properties:
      resolvers:
        items:
          $ref: '#/definitions/types.InterfaceResolvers'
        type: array
    type: object
  types.NetfilterRes:
    properties:
      ok:
        description: 'false while the committer''s first pass after start has not completed, or while its passes have failed for five seconds in a row with none completed; then every group that would be live answers live false and liveReason not-written.'
        example: true
        type: boolean
      firstWritePending:
        description: 'Present (and true) only while the committer''s first pass after start has not completed -- the chains of the groups brought up at start are not written yet. This is not an error; if those passes are also failing, error and since are present too.'
        example: true
        type: boolean
      error:
        description: 'Present only while passes are failing. The pass error -- the last one that is not a race with the firmware, else the last race.'
        example: i/o error
        type: string
      since:
        description: 'Present only while passes are failing. Unix time in seconds by the router''s clock when the first pass after the last successful one failed; it may be wrong before the clock is synced by NTP.'
        example: 1790000000
        type: integer
    required:
    - ok
    type: object
  types.LoginReq:
    properties:
      login:
        example: admin
        type: string
      password:
        example: hunter2
        type: string
    required:
    - login
    - password
    type: object
  types.LoginRes:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiJ9...
        type: string
    type: object
  types.IfLayerHookReq:
    properties:
      iface:
        example: nwg0
        type: string
      layer:
        example: link
        type: string
      level:
        example: disabled
        type: string
    required:
    - iface
    type: object
  types.NetfilterDHookReq:
    properties:
      table:
        example: nat
        type: string
      type:
        example: iptables
        type: string
    type: object
  types.RuleReq:
    description: 'A rule the daemon can actually route with. `type` is one of domain, namespace, wildcard, regex, subnet, subnet6; `rule` must be usable for that type -- a prefix for subnet/subnet6, a regex that compiles, never empty. Anything else is 400: a rule that matches nothing would otherwise be stored, listed and shown enabled while doing nothing.'
    properties:
      comment:
        description: 'One line about the rule, for people only. Spaces around it are trimmed; empty or only spaces means none. At most 256 bytes of UTF-8 after trimming, no control characters (C0, DEL, C1) and no U+2028 or U+2029. Anything else is 400, naming the rule (and the group, where the request carries one).'
        example: 'Meta: CDN'
        type: string
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      ports:
        description: 'subnet/subnet6 only, and only with `proto`: a comma-separated list of ports or ranges, `N` or `N-M`, 1..65535, at most 15 ports where a range counts as two. Absent or empty means every port. Anything else is 400.'
        example: 53,1000-2000
        type: string
      proto:
        description: 'subnet/subnet6 only: `tcp` or `udp`, the one protocol the prefix is routed for; the other keeps the main table. Absent or empty means both. Set on any other rule type it is 400.'
        example: udp
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: domain
        type: string
    type: object
  types.RuleRes:
    properties:
      comment:
        description: Present only when set.
        example: 'Meta: CDN'
        type: string
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      ports:
        description: Present only when set.
        example: 53,1000-2000
        type: string
      proto:
        description: Present only when set.
        example: udp
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: domain
        type: string
    type: object
  types.RulesRes:
    properties:
      rules:
        items:
          $ref: '#/definitions/types.RuleRes'
        type: array
    type: object
  types.SubRuleReq:
    description: 'Edits one rule of a group''s list. Only `type` and `enable` can change: the pattern itself comes from the list, and the next sync would overwrite an edit, so a request with `rule` is 400 rather than a silent no-op. `type` is checked as everywhere else: a type the daemon cannot use for this pattern is 400 with the rule''s name.'
    properties:
      enable:
        example: false
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      type:
        example: namespace
        type: string
    type: object
  types.SubRulesPatchReq:
    description: The rules that CHANGED, and only those. The body does not grow with the list.
    properties:
      rules:
        items:
          $ref: '#/definitions/types.SubRuleReq'
        type: array
    type: object
  types.SubRulesPageRes:
    description: 'One page of the group''s list rules. `total` counts the whole list, `matched` every rule matching `q`; `rules` is a slice of the matching ones, no longer than `limit`.'
    properties:
      matched:
        example: 1
        type: integer
      offset:
        example: 0
        type: integer
      rules:
        items:
          $ref: '#/definitions/types.SubRuleRes'
        type: array
      total:
        example: 1
        type: integer
    type: object
  types.SubRuleRes:
    properties:
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: namespace
        type: string
    type: object
  types.ListCatalogSource:
    properties:
      id:
        description: 'Source id, `[a-z0-9-]{1,32}`; the WebUI shows it as a badge'
        example: sagernet
        type: string
      names:
        description: 'Rule-set names, each `[A-Za-z0-9._@!-]{1,128}`'
        items:
          type: string
        type: array
      url:
        description: 'Raw URL template on raw.githubusercontent.com with exactly one `{}`, replaced by a name'
        example: https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-{}.srs
        type: string
    type: object
  types.ListCatalogRes:
    properties:
      fetchedAt:
        description: 'Unix seconds of the fetch this copy came from'
        example: 1792634400
        type: integer
      generated:
        description: 'When the index was built, as the index says'
        example: '2026-10-22T03:00:00Z'
        type: string
      sources:
        items:
          $ref: '#/definitions/types.ListCatalogSource'
        type: array
      stale:
        description: 'true when the last refetch failed and this is the older copy'
        type: boolean
    type: object
  types.SubPreviewRes:
    description: 'What a list contains, without the list. `total` and `byType` are counted over all of it; `rules` is a bounded SAMPLE (100), because serialising every rule of a real blocklist costs the router about eight times the response in cJSON tree. `dropped` is the number of LINES the parser could make nothing of -- a hosts-format or AdBlock list yields nothing routable, and an empty preview with no reason reads as an empty file, a wrong URL, or a bug.'
    properties:
      byType:
        additionalProperties:
          type: integer
        type: object
      dropped:
        example: 0
        type: integer
      rules:
        items:
          $ref: '#/definitions/types.SubRuleRes'
        type: array
      total:
        example: 1
        type: integer
    type: object
  types.TunnelUplink:
    properties:
      kind:
        description: 'auto: the router''s own routes; iface: leave by an interface; tunnel: leave through another tunnel'
        enum:
        - auto
        - iface
        - tunnel
        example: iface
        type: string
      ref:
        description: 'The interface name or the tunnel id; empty for auto'
        example: ppp0
        type: string
    type: object
  types.TunnelHeader:
    properties:
      name:
        example: X-HWID
        type: string
      value:
        example: 6e58d9776d738a31
        type: string
    type: object
  types.TunnelHeadersRes:
    properties:
      headers:
        description: 'In the order they are sent; a header the router cannot give is absent'
        items:
          $ref: '#/definitions/types.TunnelHeader'
        type: array
    type: object
  types.TunnelSource:
    properties:
      headers:
        additionalProperties:
          type: string
        description: 'subscription only: request headers over the default set (GET /api/v1/tunnels/headers), matched by name in any case; an empty value leaves that default out. At most 16; a name is an HTTP token of up to 64 bytes, a value up to 512 bytes without control characters; Host, Content-Length, Transfer-Encoding and Connection are refused. Absent when the subscription has none'
        example:
          X-HWID: ''
          User-Agent: sing-box/1.12.0
        type: object
      id:
        description: 'Eight hex digits; node keys start with it. Optional on PUT: a missing one is derived from the link or URL'
        example: 0000000a
        type: string
      interval:
        description: 'subscription only: seconds between fetches, 0 = by hand only, else 600..604800 (default 21600)'
        example: 21600
        type: integer
      kind:
        enum:
        - link
        - subscription
        example: subscription
        type: string
      link:
        description: 'link only: one vless:// link'
        example: vless://00000000-0000-4000-8000-000000000001@a.example.invalid:443?security=none#A
        type: string
      name:
        description: 'subscription only: 1..63 letters, digits, spaces, ''.'', ''_'' or ''-'', unique in the tunnel'
        example: Provider
        type: string
      url:
        description: 'subscription only: an http:// or https:// URL, fetched through the tunnel''s uplink'
        example: https://sub.example.invalid/feed
        type: string
    type: object
  types.TunnelAdvanced:
    properties:
      ca:
        description: 'Trusted roots (PEM file) for security=tls nodes; empty for the system ones'
        example: ""
        type: string
      fingerprint:
        description: 'ClientHello fingerprint for every node; empty for the one each link names'
        enum:
        - ""
        - chrome
        - firefox
        example: ""
        type: string
      insecure:
        description: 'Accept allowInsecure nodes and skip certificate checks'
        example: false
        type: boolean
      kernelTcp:
        description: 'The kernel terminates the TCP of groups routed into this tunnel and hands it to tunvless'
        example: false
        type: boolean
      timeout:
        description: 'Probe timeout in seconds, 1..600 (default 8)'
        example: 8
        type: integer
    type: object
  types.TunnelInbound:
    properties:
      listen:
        description: 'A name from app.link that is not a WAN interface; its IPv4 address is bound'
        example: br0
        type: string
      node:
        description: 'Node key, <source id>:<name>; an excluded or filtered node still serves it'
        example: 0000000a:NL-1
        type: string
      password:
        description: 'With user: 1..255 bytes, no control characters; empty for no authentication'
        example: ""
        type: string
      port:
        description: '1..65535; not the WebUI port, the DNS proxy port, 53 or 3600..3699'
        example: 1081
        type: integer
      user:
        description: 'With password: 1..255 bytes, no control characters, no colon; empty for no authentication'
        example: ""
        type: string
    type: object
  types.TunnelInboundState:
    properties:
      port:
        example: 1081
        type: integer
      rxBps:
        description: 'Bytes per second sent to the client since the previous poll'
        example: 0
        type: integer
      state:
        enum:
        - up
        - busy
        - no-node
        - no-address
        - not-lan
        - starting
        - "off"
        example: up
        type: string
      txBps:
        description: 'Bytes per second read from the client since the previous poll'
        example: 0
        type: integer
      why:
        description: 'Detail for busy and a failed bind; empty otherwise'
        example: ""
        type: string
    type: object
  types.Tunnel:
    properties:
      active:
        description: 'How many nodes carry traffic at once, 1..8'
        example: 1
        type: integer
      advanced:
        $ref: '#/definitions/types.TunnelAdvanced'
      by:
        description: 'How flows spread over the active nodes'
        enum:
        - connection
        - site
        - site-client
        example: connection
        type: string
      description:
        description: 'Free text shown next to the device, up to 63 bytes of UTF-8, no control characters; empty for none'
        example: PRAW-1
        type: string
      device:
        description: 'tunvless<N>, N 0..99, unique'
        example: tunvless0
        type: string
      enable:
        example: true
        type: boolean
      exclude:
        description: 'Node keys never used'
        items:
          type: string
        type: array
      filter:
        description: 'POSIX extended regular expression on subscription node names, case-insensitive; empty keeps all'
        example: ^NL-
        type: string
      id:
        description: 'Letters, digits, - and _, under 16 bytes, unique'
        example: main
        type: string
      inbounds:
        description: 'Local SOCKS5 and HTTP CONNECT listeners bound to one node each, at most 16; always present'
        items:
          $ref: '#/definitions/types.TunnelInbound'
        type: array
      interval:
        description: 'Seconds between checks of the active nodes, 5..86400'
        example: 60
        type: integer
      order:
        description: 'Node keys listed first, in this order'
        items:
          type: string
        type: array
      silence:
        description: 'Seconds of silence before a node is checked, 0..3600'
        example: 20
        type: integer
      sources:
        items:
          $ref: '#/definitions/types.TunnelSource'
        type: array
      uplink:
        $ref: '#/definitions/types.TunnelUplink'
    type: object
  types.TunnelsReq:
    properties:
      tunnels:
        description: 'The whole set, at most 8; a missing field takes its default'
        items:
          $ref: '#/definitions/types.Tunnel'
        type: array
    type: object
  types.TunnelsRes:
    properties:
      restarted:
        description: 'PUT only: devices whose tunvless this save started or restarted'
        items:
          example: tunvless0
          type: string
        type: array
      tunnels:
        items:
          $ref: '#/definitions/types.Tunnel'
        type: array
      updated:
        description: 'PUT only: devices whose running tunvless this save sent a new node list, without a restart'
        items:
          example: tunvless1
          type: string
        type: array
    type: object
  types.TunnelErrorRes:
    properties:
      error:
        example: no tunnel with this id
        type: string
      field:
        description: 'The rejected field of the tunnel, as in the request (sources[1].url); null when none applies'
        example: uplink
        type: string
      tunnel:
        description: 'The id of the rejected tunnel; null when it has none or the set itself was rejected'
        example: chained
        type: string
    type: object
  types.TunnelNodeState:
    properties:
      key:
        example: 0000000a:NL-1
        type: string
      name:
        example: NL-1
        type: string
      since:
        description: 'down only: unix seconds since the node stopped answering; else 0'
        example: 0
        type: integer
      skipReason:
        description: 'skipped only: why the node cannot be used'
        example: ""
        type: string
      source:
        description: '"link" or the subscription''s name'
        example: Provider
        type: string
      state:
        enum:
        - active
        - down
        - reserve
        - excluded
        - missing
        - skipped
        example: active
        type: string
    type: object
  types.TunnelSubState:
    properties:
      error:
        description: 'Why the last fetch failed; the URL in it is cut to scheme://host'
        example: ""
        type: string
      fetching:
        example: false
        type: boolean
      lastOk:
        description: 'Unix seconds of the last good fetch; 0 never'
        example: 1791300000
        type: integer
      lastTry:
        description: 'Unix seconds of the last fetch; 0 never'
        example: 1791300000
        type: integer
      name:
        example: Provider
        type: string
      nodes:
        description: 'Nodes in the held body'
        example: 12
        type: integer
    type: object
  types.TunnelState:
    properties:
      active:
        description: 'Names of the nodes carrying traffic'
        items:
          type: string
        type: array
      backoffS:
        description: 'backoff only: seconds until the next start'
        example: 0
        type: integer
      device:
        example: tunvless0
        type: string
      groups:
        description: 'Names of the groups routed through the device'
        items:
          type: string
        type: array
      id:
        example: main
        type: string
      inbounds:
        description: 'One row per inbound of the tunnel, in its order'
        items:
          $ref: '#/definitions/types.TunnelInboundState'
        type: array
      lastExit:
        description: 'Exit code of the last tunvless, 128+signal when killed'
        example: 0
        type: integer
      nodes:
        items:
          $ref: '#/definitions/types.TunnelNodeState'
        type: array
      rxBps:
        description: 'Bytes per second received on the device since the previous poll'
        example: 0
        type: integer
      since:
        description: 'Unix seconds since the status last changed'
        example: 1791300000
        type: integer
      status:
        description: 'waiting: no nodes yet; uplink_down: its uplink could not be set up'
        enum:
        - "off"
        - starting
        - up
        - no_node
        - backoff
        - bad_config
        - waiting
        - uplink_down
        example: up
        type: string
      subscriptions:
        items:
          $ref: '#/definitions/types.TunnelSubState'
        type: array
      tcpPort:
        description: 'Local port tunvless takes the kernel-terminated TCP on; 0 for none'
        example: 0
        type: integer
      tcpSkipped:
        description: 'Kernel interface names of the segments whose access list can deny; their TCP keeps the TUN path. A WAN interface may appear (the WebUI hides it). Empty while tcpPort is 0'
        items:
          type: string
        type: array
      tcpOff:
        description: 'Why no TCP of this tunnel is redirected now (acl: an access list cannot be read or judged; kernel: no REDIRECT or addrtype; refused: the kernel refused the rule). Empty while kernel TCP is off for the tunnel'
        enum:
        - ""
        - acl
        - kernel
        - refused
        example: ""
        type: string
      txBps:
        example: 0
        type: integer
      uplinkOk:
        description: 'The uplink route is in place (always true for auto)'
        example: true
        type: boolean
    type: object
  types.TunnelStatesRes:
    properties:
      tunnels:
        description: 'Every configured tunnel, in config order'
        items:
          $ref: '#/definitions/types.TunnelState'
        type: array
    type: object
  types.TunnelDraftReq:
    properties:
      tunnel:
        $ref: '#/definitions/types.Tunnel'
    type: object
  types.TunnelPreviewRow:
    properties:
      excluded:
        example: false
        type: boolean
      isNew:
        description: 'Not named in order'
        example: true
        type: boolean
      key:
        example: 0000000a:NL-1
        type: string
      missing:
        description: 'Named in order but in no source'
        example: false
        type: boolean
      name:
        example: NL-1
        type: string
      overCap:
        description: 'Past the 256 nodes tunvless is given'
        example: false
        type: boolean
      skipReason:
        example: ""
        type: string
      source:
        example: Provider
        type: string
    type: object
  types.TunnelPreviewRes:
    properties:
      matched:
        description: 'Usable nodes the filter keeps'
        example: 3
        type: integer
      nodes:
        items:
          $ref: '#/definitions/types.TunnelPreviewRow'
        type: array
      subscriptions:
        items:
          properties:
            cached:
              description: 'A body for this subscription and uplink is held'
              example: true
              type: boolean
            name:
              example: Provider
              type: string
          type: object
        type: array
      total:
        description: 'Usable nodes in every source'
        example: 4
        type: integer
    type: object
  types.TunnelProbeReq:
    properties:
      id:
        description: 'Probe the saved tunnel with this id'
        example: main
        type: string
      tunnel:
        $ref: '#/definitions/types.Tunnel'
    type: object
  types.TunnelProbeRow:
    properties:
      firstByteMs:
        description: 'null when the node failed'
        example: 61
        type: integer
      handshakeMs:
        description: 'null when the node failed'
        example: 42
        type: integer
      key:
        example: 0000000a:NL-1
        type: string
      ok:
        example: true
        type: boolean
      why:
        example: ""
        type: string
    type: object
  types.TunnelProbeRes:
    properties:
      nodes:
        items:
          $ref: '#/definitions/types.TunnelProbeRow'
        type: array
    type: object
  types.QueuedRes:
    properties:
      queued:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  title: firc API
  version: "0.1"
# The route registrations in src/backend-c/src/api/*.c are the source of
# truth; this file is written from them by hand and can fall behind
# (tools/ci/check_swagger_routes.py checks the paths) -- if something here
# disagrees with them, they are right.
paths:
  /api/v1/auth:
    get:
      description: >-
        Always answers `enabled: true`: authentication is required and cannot
        be turned off. Answers without a token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.AuthRes'
      security: []
      summary: 'Authentication state'
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: >-
        Checks the login and password and issues a JWT. No token is needed or
        checked here: this is the only way to get one.
      parameters:
      - description: 'Request body'
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "429":
          description: >-
            Too many failed attempts in a row. The answer comes at once, but
            the password is not checked -- wait a second and retry
          schema:
            $ref: '#/definitions/types.ErrorRes'
      security: []
      summary: 'Log in'
      tags:
      - auth
  /api/v1/groups:
    get:
      description: 'Returns the list of groups'
      parameters:
      - description: 'Return the groups with their rules'
        in: query
        name: with_rules
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GroupsRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: 'Get the list of groups'
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: 'Creates a group. A rejection of a group field names the field and the group. A group that failed to come up is 500 with the text group "<name>": <step>: <error>.'
      parameters:
      - description: 'Save the changes to groups.yaml. A write that fails leaves the changes applied and answers 500 "applied, but groups.yaml was not saved: <error>"'
        in: query
        name: save
        type: boolean
      - description: 'Request body'
