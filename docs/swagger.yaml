      description: 'Creates a rule'
      parameters:
      - description: 'Group ID'
        in: path
        name: groupID
        required: true
        type: string
      - description: 'Save the changes to groups.yaml. A write that fails leaves the changes applied and answers 500 "applied, but groups.yaml was not saved: <error>"'
        in: query
        name: save
        type: boolean
      - description: 'Request body'
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.RuleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.RuleRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: 'Create a rule'
      tags:
