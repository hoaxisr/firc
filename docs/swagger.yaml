            $ref: '#/definitions/types.GroupErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: 'Update the list of groups'
      tags:
      - groups
  /api/v1/groups/{groupID}:
    delete:
      description: 'Deletes the requested group. A kernel error while taking the group down does not stop the deletion: the answer is 200. An invalid group ID: the answer is 400.'
      parameters:
      - description: 'Group ID'
        in: path
        name: groupID
        required: true
        type: string
      - description: 'Save the changes to groups.yaml. A write that fails leaves the changes applied and answers 500 "applied, but groups.yaml was not saved: <error>"'
        in: query
        name: save
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: 'Delete a group'
      tags:
      - groups
    get:
      description: 'Returns the requested group'
      parameters:
      - description: 'Group ID'
        in: path
        name: groupID
        required: true
        type: string
      - description: 'Return the group with its rules'
        in: query
        name: with_rules
