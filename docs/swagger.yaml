    put:
      consumes:
      - application/json
      description: 'Updates the requested rule'
      parameters:
      - description: 'Group ID'
        in: path
        name: groupID
        required: true
        type: string
      - description: 'Rule ID'
        in: path
        name: ruleID
        required: true
        type: string
      - description: 'Save the changes to groups.yaml. A write that fails leaves the changes applied and answers 500 "applied, but groups.yaml was not saved: <error>"'
        in: query
        name: save
        type: boolean
      - description: 'Request body'
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.RuleReq'
      produces:
