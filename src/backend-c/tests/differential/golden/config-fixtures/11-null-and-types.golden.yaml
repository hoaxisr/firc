configVersion: 0.99.0
app:
  httpWeb:
    enabled: true
    host:
      address: '[::]'
      port: 666
  dnsProxy:
    host:
      address: '[::]'
      port: 3553
    upstream:
      address: 127.0.0.1
      port: 53
    disableRemap53: false
    disableDropAAAA: false
    unmatchedTtl: 1m0s
    maxIdleConns: 10
    maxConcurrent: 100
    timeout: 5s
  netfilter:
    iptables:
      chainPrefix: "123"
    disableIPv4: false
    disableIPv6: false
    startMarkTableIndex: 1718186595
  addressPool:
    v4:
      pool: 198.18.0.0/15
      chunk: 24
    v6:
      pool: ""
      chunk: 64
    ttlClamp: 5m0s
    maxNames: 65536
  link:
  - br0
  showAllInterfaces: false
  logLevel: info
groups: []
