configVersion: 0.99.0
app:
  httpWeb:
    enabled: true
    host:
      address: 0.0.0.0
      port: 8081
  dnsProxy:
    host:
      address: '[::]'
      port: 3553
    upstream:
      address: 192.168.1.1
      port: 53
    disableRemap53: true
    disableDropAAAA: true
    unmatchedTtl: 1m0s
    maxIdleConns: 20
    maxConcurrent: 200
    timeout: 7s
  netfilter:
    iptables:
      chainPrefix: XX_
    disableIPv4: false
    disableIPv6: true
    startMarkTableIndex: 1000
  addressPool:
    v4:
      pool: 198.18.0.0/15
      chunk: 24
    v6:
      pool: ""
      chunk: 64
    ttlClamp: 5m0s
    idleWindow: 24h0m0s
    maxNames: 65536
  link:
  - br0
  - br1
  showAllInterfaces: true
  logLevel: debug
groups:
- id: d663876a
  name: Example
  interface: nwg0
  enable: true
  rules:
  - id: 6f34ee91
    type: wildcard
    rule: '*wildcard.example.com'
    enable: true
  - id: 00ae5f7c
    type: regex
    rule: ^.*\.regex\.example\.com$
    enable: false
  - id: 6120dc8a
    type: domain
    rule: domain.example.com
    enable: true
  - id: b9751782
    type: namespace
    rule: namespace.example.com
    enable: true
  - id: "12345678"
    type: subnet
    rule: 10.0.0.0/8
    enable: true
  - id: "666e0000"
    type: subnet6
    rule: fd00::/8
    enable: true
- id: aabbccdd
  name: My Sub
  interface: nwg1
  enable: true
  rules: []
  list:
    url: https://example.com/list.txt
    interval: 86400
    last_update: 1700000000
    overrides: []
