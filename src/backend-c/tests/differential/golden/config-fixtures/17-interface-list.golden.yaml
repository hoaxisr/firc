configVersion: 0.99.0
app:
  httpWeb:
    enabled: true
    host:
      address: '[::]'
      port: 666
  dnsProxy:
    host:
      address: '[::]'
      port: 3553
    upstream:
      address: 127.0.0.1
      port: 53
    disableRemap53: false
    disableDropAAAA: false
    disableStats: false
    unmatchedTtl: 1m0s
    maxIdleConns: 10
    maxConcurrent: 100
    timeout: 5s
  netfilter:
    iptables:
      chainPrefix: FIRC_
    disableIPv4: false
    disableIPv6: false
    startMarkTableIndex: 1718186595
  addressPool:
    v4:
      pool: 198.18.0.0/15
      chunk: 24
    v6:
      pool: ""
      chunk: 64
    ttlClamp: 5m0s
    maxNames: 65536
  link:
  - br0
  update:
    check: false
  check:
    url: http://cp.cloudflare.com/generate_204
    wanUrl: ""
    interval: 30s
    timeout: 5s
  autolist:
    enabled: false
    group: ""
    mode: candidates
    failThreshold: 3
    failTime: 1m0s
    retransThreshold: 3
    exclude: []
    recheck: false
    recheckInterval: 6h0m0s
    checkInterface: ""
groups:
- id: 0000ac01
  name: Listed
  interface:
  - nwg1
  - tunvless0
  enable: true
  rules: []
- id: 0000ac02
  name: One in a list
  interface: nwg2
  enable: true
  rules: []
